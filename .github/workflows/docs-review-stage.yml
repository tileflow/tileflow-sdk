name: Documentation review stage

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: github.head_ref == 'docs/npm-package-guides'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install review tooling
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm install --frozen-lockfile
      - name: Collect source and formatter
        run: |
          mkdir -p /tmp/docs-review
          git archive HEAD > /tmp/docs-review/source.tar
          git archive origin/main > /tmp/docs-review/base.tar
          cp -RL node_modules/prettier /tmp/docs-review/prettier
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync, readdirSync, writeFileSync} from 'node:fs';
          const results = [];
          for (const directory of readdirSync('packages')) {
            let manifest;
            try { manifest = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8')); }
            catch { continue; }
            if (manifest.private) continue;
            try {
              const content = execFileSync('npm', ['view', `${manifest.name}@alpha`, 'version', 'dist-tags', 'readme', '--json'], {encoding: 'utf8', timeout: 20000});
              results.push({name: manifest.name, metadata: JSON.parse(content)});
            } catch { results.push({name: manifest.name, error: 'Registry lookup failed'}); }
          }
          writeFileSync('/tmp/docs-review/npm.json', JSON.stringify(results, null, 2));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-review-source
          path: /tmp/docs-review
          retention-days: 1
