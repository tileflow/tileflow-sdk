name: TileflowExamples
options:
  deploymentTarget:
    iOS: '16.0'
packages:
  Tileflow:
    path: ..
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # Location purpose strings, merged into the generated Info.plist.
    INFOPLIST_FILE: Shared/Info.plist
    CODE_SIGN_STYLE: Automatic
targets:
  UIKitExample:
    type: application
    platform: iOS
    sources:
      - UIKit
      - Shared
    dependencies:
      - package: Tileflow
      - package: Tileflow
        product: TileflowServiceContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tileflow.examples.uikit
  SwiftUIExample:
    type: application
    platform: iOS
    sources:
      - SwiftUI
      - Shared
    dependencies:
      - package: Tileflow
      - package: Tileflow
        product: TileflowServiceContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tileflow.examples.swiftui
