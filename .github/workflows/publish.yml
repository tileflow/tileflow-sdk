name: Publish
run-name: Prepare npm alpha bundle from main at ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  reconcile:
    name: Prepare exact release bundle
    if: github.repository == 'tileflow/tileflow-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    outputs:
      bundle_digest: ${{ steps.bundle.outputs.bundle_digest }}
      eligible: ${{ steps.ci.outputs.eligible }}
      release_sha: ${{ env.RELEASE_SHA }}
      selected_count: ${{ steps.plan.outputs.selected_count }}
    env:
      NPM_CONFIG_PROVENANCE: 'true'
      NPM_TAG: alpha
      # Ephemeral manifest versions intentionally differ from pnpm's installed workspace snapshot.
      pnpm_config_verify_deps_before_run: warn
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout proposed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify exact successful main CI
        id: ci
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {
              assertSuccessfulRequiredJob,
              findSuccessfulMainCiRun,
            } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-workflow.mjs`);
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              status: 'completed',
              head_sha: process.env.RELEASE_SHA,
              per_page: 100,
            });
            const run = findSuccessfulMainCiRun(
              data.workflow_runs,
              repository,
              process.env.RELEASE_SHA,
            );

            if (!run) {
              core.setOutput('eligible', 'false');
              core.setFailed(
                `No successful push CI exists for ${process.env.RELEASE_SHA}; release preparation is denied.`,
              );
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              filter: 'latest',
              per_page: 100,
            });
            assertSuccessfulRequiredJob(jobs);
            core.setOutput('eligible', 'true');
            core.notice(
              `Release preparation is bound to successful CI run ${run.id} for ${process.env.RELEASE_SHA}.`,
            );

      - name: Require current main head
        if: steps.ci.outputs.eligible == 'true'
        id: head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          echo 'current=true' >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        if: steps.head.outputs.current == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Enforce public SDK release interlock
        if: steps.head.outputs.current == 'true'
        run: node scripts/public-release-interlock.mjs

      - name: Install
        if: steps.head.outputs.current == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify development manifests
        if: steps.head.outputs.current == 'true'
        run: pnpm run release:verify-source

      - name: Download current npm alpha baselines
        if: steps.head.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/tileflow-release"
          registry_dir="$release_root/registry"
          mkdir -p "$registry_dir"
          : > "$release_root/registry.tsv"
          while IFS=$'\t' read -r package_name initial_version
          do
            if current_version="$(npm view "$package_name" "dist-tags.$NPM_TAG" --prefer-online 2>&1)" && \
              [[ "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
            then
              filename="$(
                npx --yes npm@11.19.0 pack "$package_name@$current_version" \
                  --pack-destination "$registry_dir" \
                  --json \
                  | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const result = JSON.parse(data); if (!Array.isArray(result) || result.length !== 1 || typeof result[0]?.filename !== 'string') throw new Error('Unexpected npm pack JSON.'); console.log(result[0].filename); });"
              )"
              if [[ "$filename" != /* ]]
              then
                filename="$registry_dir/$filename"
              fi
              printf '%s\t%s\t%s\tpublished\n' "$package_name" "$current_version" "$filename" \
                >> "$release_root/registry.tsv"
            elif [[ -z "$current_version" || "$current_version" = *E404* ]]
            then
              if package_identity="$(npm view "$package_name" name --prefer-online 2>&1)"
              then
                test "$package_identity" = "$package_name"
              elif [[ "$package_identity" != *E404* ]]
              then
                echo "$package_identity"
                echo "Unable to determine package existence for $package_name."
                exit 1
              fi
              printf '%s\t%s\t-\tunpublished\n' "$package_name" "$initial_version" \
                >> "$release_root/registry.tsv"
              echo "$package_name has no alpha release; planning its configured first release $initial_version."
            else
              echo "$current_version"
              echo "Unable to determine registry baseline for $package_name."
              exit 1
            fi
          done < <(node scripts/reconcile-release.mjs catalog)

          node scripts/reconcile-release.mjs \
            registry \
            "$release_root/registry.tsv" \
            "$release_root/registry.json"

      - name: Build and pack at current registry versions
        if: steps.head.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/tileflow-release"
          node scripts/reconcile-release.mjs apply "$release_root/registry.json"
          pnpm exec turbo build --force
          node scripts/reconcile-release.mjs \
            pack \
            "$release_root/candidate" \
            "$release_root/candidate-tarballs.txt"

      - name: Plan changed package releases
        if: steps.head.outputs.current == 'true'
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/tileflow-release"
          node scripts/reconcile-release.mjs \
            plan \
            "$RELEASE_SHA" \
            "$release_root/registry.json" \
            "$release_root/candidate-tarballs.txt" \
            "$release_root/plan.json"
          selected_count="$(PLAN_PATH="$release_root/plan.json" node -e "const plan = require(process.env.PLAN_PATH); console.log(plan.packages.length);")"
          echo "selected_count=$selected_count" >> "$GITHUB_OUTPUT"
          node scripts/reconcile-release.mjs summary "$release_root/plan.json"

      - name: Apply target versions, rebuild, and verify
        if: steps.plan.outputs.selected_count != '' && steps.plan.outputs.selected_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/tileflow-release"
          node scripts/reconcile-release.mjs apply "$release_root/plan.json"
          pnpm exec turbo build --force
          pnpm check
          node scripts/reconcile-release.mjs \
            pack \
            "$release_root/final" \
            "$release_root/final-tarballs.txt"
          node scripts/reconcile-release.mjs \
            validate \
            "$release_root/plan.json" \
            "$release_root/registry.json" \
            "$release_root/final-tarballs.txt"
          node scripts/select-release-tarballs.mjs \
            "$release_root/plan.json" \
            "$release_root/final-tarballs.txt" \
            "$release_root/selected-tarballs.txt"

      - name: Provision pinned capture browser dependencies
        if: steps.plan.outputs.selected_count != '' && steps.plan.outputs.selected_count != '0'
        run: pnpm --filter @tileflow/capture exec playwright install-deps chromium

      - name: Provision pinned capture browser shell
        if: steps.plan.outputs.selected_count != '' && steps.plan.outputs.selected_count != '0'
        run: pnpm --filter @tileflow/capture exec playwright install --only-shell chromium

      - name: Authorize the pinned Chromium sandbox
        if: steps.plan.outputs.selected_count != '' && steps.plan.outputs.selected_count != '0'
        run: bash scripts/configure-linux-chromium-sandbox.sh

      - name: Verify the pinned capture browser shell
        if: steps.plan.outputs.selected_count != '' && steps.plan.outputs.selected_count != '0'
        run: pnpm --filter @tileflow/cli run cli setup capture --json --no-browser-install

      - name: Smoke final packed packages
        if: steps.plan.outputs.selected_count != '' && steps.plan.outputs.selected_count != '0'
        run: >-
          node scripts/capture-public-smoke.mjs
          --pack-dir "$RUNNER_TEMP/tileflow-release/final"
          --release-plan "$RUNNER_TEMP/tileflow-release/plan.json"

      - name: Recheck current main before handing off publication
        if: steps.plan.outputs.selected_count != '' && steps.plan.outputs.selected_count != '0'
        id: publish-head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          echo 'current=true' >> "$GITHUB_OUTPUT"

      - name: Create immutable release bundle
        if: steps.publish-head.outputs.current == 'true'
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/tileflow-release"
          mkdir -p "$release_root/selected"
          : > "$release_root/selected-relative.txt"
          while IFS= read -r tarball
          do
            [[ -n "$tarball" ]] || continue
            filename="$(basename "$tarball")"
            cp "$tarball" "$release_root/selected/$filename"
            echo "selected/$filename" >> "$release_root/selected-relative.txt"
          done < "$release_root/selected-tarballs.txt"
          tar -cf "$release_root/release-bundle.tar" \
            -C "$release_root" \
            plan.json \
            selected-relative.txt \
            selected
          bundle_digest="$(shasum -a 256 "$release_root/release-bundle.tar" | cut -d ' ' -f 1)"
          echo "bundle_digest=$bundle_digest" >> "$GITHUB_OUTPUT"
          {
            echo '## Approval boundary'
            echo
            echo "Bundle SHA-256: \`$bundle_digest\`"
            echo
            echo 'The `npm-publish` environment approval publishes only the tarballs in this bundle.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable release bundle
        if: steps.publish-head.outputs.current == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/tileflow-release/release-bundle.tar
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Approve and publish exact bundle
    needs: reconcile
    if: >-
      ${{
        needs.reconcile.outputs.eligible == 'true' &&
        needs.reconcile.outputs.selected_count != '' &&
        needs.reconcile.outputs.selected_count != '0' &&
        needs.reconcile.outputs.bundle_digest != ''
      }}
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      BUNDLE_DIGEST: ${{ needs.reconcile.outputs.bundle_digest }}
      NPM_CONFIG_PROVENANCE: 'true'
      NPM_TAG: alpha
      RELEASE_SHA: ${{ needs.reconcile.outputs.release_sha }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/tileflow-release-download

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify release bundle and current main
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/tileflow-release-download/release-bundle.tar"
          test "$(shasum -a 256 "$bundle" | cut -d ' ' -f 1)" = "$BUNDLE_DIGEST"
          mkdir -p "$RUNNER_TEMP/tileflow-release"
          tar -xf "$bundle" -C "$RUNNER_TEMP/tileflow-release"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          PLAN_PATH="$RUNNER_TEMP/tileflow-release/plan.json" RELEASE_SHA="$RELEASE_SHA" \
            node -e "const plan = require(process.env.PLAN_PATH); if (plan.sourceSha !== process.env.RELEASE_SHA || !Array.isArray(plan.packages) || plan.packages.length === 0) throw new Error('Release bundle does not match the source SHA.');"

      - name: Preflight npm registry
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/tileflow-release"
          : > "$release_root/publish.txt"
          : > "$release_root/published.txt"
          published_dir="$release_root/published"
          mkdir -p "$published_dir"

          while IFS= read -r relative_tarball
          do
            [[ -n "$relative_tarball" ]] || continue
            tarball="$release_root/$relative_tarball"
            package_json="$(tar -xOf "$tarball" package/package.json)"
            package_name="$(PACKAGE_JSON="$package_json" node -e "console.log(JSON.parse(process.env.PACKAGE_JSON).name);")"
            package_version="$(PACKAGE_JSON="$package_json" node -e "console.log(JSON.parse(process.env.PACKAGE_JSON).version);")"
            previous_version="$(PLAN_PATH="$release_root/plan.json" PACKAGE_NAME="$package_name" node -e "const release = require(process.env.PLAN_PATH).packages.find(({name}) => name === process.env.PACKAGE_NAME); if (!release) throw new Error('Package is absent from release plan.'); console.log(release.from ?? 'unpublished');")"
            planned_version="$(PLAN_PATH="$release_root/plan.json" PACKAGE_NAME="$package_name" node -e "const release = require(process.env.PLAN_PATH).packages.find(({name}) => name === process.env.PACKAGE_NAME); if (!release) throw new Error('Package is absent from release plan.'); console.log(release.to);")"
            baseline_state="$(PLAN_PATH="$release_root/plan.json" PACKAGE_NAME="$package_name" node -e "const baseline = require(process.env.PLAN_PATH).baselines.find(({name}) => name === process.env.PACKAGE_NAME); if (!baseline || typeof baseline.published !== 'boolean') throw new Error('Package baseline is absent from release plan.'); console.log(baseline.published ? 'published' : 'unpublished');")"
            test "$package_version" = "$planned_version"

            if current_tag="$(npm view "$package_name" "dist-tags.$NPM_TAG" --prefer-online 2>&1)" && \
              [[ -n "$current_tag" ]]
            then
              :
            elif [[ "$baseline_state" = unpublished && \
              ( -z "$current_tag" || "$current_tag" = *E404* ) ]]
            then
              current_tag=unpublished
            else
              echo "$current_tag"
              echo "Unable to determine current alpha tag for $package_name."
              exit 1
            fi
            if view_output="$(npm view "$package_name@$package_version" version --prefer-online 2>&1)"
            then
              test "$view_output" = "$package_version"
              published_tarball="$(
                npx --yes npm@11.19.0 pack "$package_name@$package_version" \
                  --pack-destination "$published_dir" \
                  --json \
                  | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const result = JSON.parse(data); if (!Array.isArray(result) || result.length !== 1 || typeof result[0]?.filename !== 'string') throw new Error('Unexpected npm pack JSON.'); console.log(result[0].filename); });"
              )"
              if [[ "$published_tarball" != /* ]]
              then
                published_tarball="$published_dir/$published_tarball"
              fi
              if node scripts/compare-package-tarballs.mjs "$tarball" "$published_tarball"
              then
                target_state=identical
              else
                target_state=different
              fi
            else
              if [[ "$view_output" != *E404* ]]
              then
                echo "$view_output"
                echo "Unable to determine registry state for $package_name@$package_version."
                exit 1
              fi
              target_state=missing
            fi

            decision="$(
              node scripts/publication-decision.mjs \
                "$previous_version" \
                "$package_version" \
                "$current_tag" \
                "$target_state" \
                "$baseline_state"
            )"
            if [[ "$decision" = publish ]]
            then
              if [[ "$baseline_state" = published ]]
              then
                previous_output="$(npm view "$package_name@$previous_version" version --prefer-online)"
                test "$previous_output" = "$previous_version"
              fi
              echo "$tarball" >> "$release_root/publish.txt"
            elif [[ "$decision" = published ]]
            then
              echo "$tarball" >> "$release_root/published.txt"
            else
              echo "Unexpected publication decision for $package_name: $decision."
              exit 1
            fi
          done < "$release_root/selected-relative.txt"

          selected_count="$(wc -l < "$release_root/selected-relative.txt" | tr -d ' ')"
          publish_count="$(wc -l < "$release_root/publish.txt" | tr -d ' ')"
          published_count="$(wc -l < "$release_root/published.txt" | tr -d ' ')"
          test "$((publish_count + published_count))" = "$selected_count"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          echo "Registry preflight passed for $selected_count package(s): $publish_count new, $published_count identical."

      - name: Publish changed packages
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]
          then
            echo 'GitHub did not expose OIDC request credentials.'
            exit 1
          fi

          while IFS= read -r tarball
          do
            [[ -n "$tarball" ]] || continue
            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
            npx --yes npm@11.19.0 publish "$tarball" \
              --access public \
              --registry https://registry.npmjs.org \
              --tag "$NPM_TAG" \
              --provenance \
              --loglevel verbose
          done < "$RUNNER_TEMP/tileflow-release/publish.txt"

      - name: Verify exact published artifacts and create receipt
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/tileflow-release"
          verified_dir="$release_root/verified"
          mkdir -p "$verified_dir"

          while IFS= read -r relative_tarball
          do
            [[ -n "$relative_tarball" ]] || continue
            tarball="$release_root/$relative_tarball"
            package_json="$(tar -xOf "$tarball" package/package.json)"
            package_name="$(PACKAGE_JSON="$package_json" node -e "console.log(JSON.parse(process.env.PACKAGE_JSON).name);")"
            package_version="$(PACKAGE_JSON="$package_json" node -e "console.log(JSON.parse(process.env.PACKAGE_JSON).version);")"

            current_tag=''
            for attempt in 1 2 3 4 5
            do
              if current_tag="$(npm view "$package_name" "dist-tags.$NPM_TAG" --prefer-online 2>/dev/null)" && \
                [[ "$current_tag" = "$package_version" ]]
              then
                break
              fi
              sleep "$((attempt * 2))"
            done
            test "$current_tag" = "$package_version"

            local_integrity="$(TARBALL="$tarball" node -e "const {createHash} = require('node:crypto'); const {readFileSync} = require('node:fs'); process.stdout.write('sha512-' + createHash('sha512').update(readFileSync(process.env.TARBALL)).digest('base64'));")"
            registry_integrity="$(npm view "$package_name@$package_version" dist.integrity --prefer-online)"
            test "$registry_integrity" = "$local_integrity"

            published_tarball="$(
              npx --yes npm@11.19.0 pack "$package_name@$package_version" \
                --pack-destination "$verified_dir" \
                --json \
                | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const result = JSON.parse(data); if (!Array.isArray(result) || result.length !== 1 || typeof result[0]?.filename !== 'string') throw new Error('Unexpected npm pack JSON.'); console.log(result[0].filename); });"
            )"
            if [[ "$published_tarball" != /* ]]
            then
              published_tarball="$verified_dir/$published_tarball"
            fi
            node scripts/compare-package-tarballs.mjs "$tarball" "$published_tarball"
          done < "$release_root/selected-relative.txt"

          node scripts/create-release-receipt.mjs \
            "$release_root/plan.json" \
            "$release_root/selected-relative.txt" \
            "$BUNDLE_DIGEST" \
            "$release_root/release-receipt.json"

      - name: Upload final release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-receipt-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/tileflow-release/release-receipt.json
          if-no-files-found: error
          retention-days: 90
