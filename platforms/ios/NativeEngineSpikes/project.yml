name: NativeEngineSpikes
options:
  bundleIdPrefix: dev.tileflow.spikes
  deploymentTarget:
    iOS: '16.0'
packages:
  Tileflow:
    path: ..
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  NativeEngineHost:
    type: application
    platform: iOS
    sources:
      - Host
    dependencies:
      - package: MapLibre
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  NativeEngineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: '5.0'
    dependencies:
      - target: NativeEngineHost
      - package: Tileflow
      - package: MapLibre
schemes:
  NativeEngineSpikes:
    build:
      targets:
        NativeEngineHost: all
    test:
      targets:
        - NativeEngineTests
