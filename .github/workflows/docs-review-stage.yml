name: Documentation review stage

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.number == 92 && github.head_ref == 'docs/npm-package-guides' && github.event.pull_request.head.repo.full_name == 'tileflow/tileflow-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Reconstruct the reviewed documentation files
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/docs-review
          python <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request
          root = pathlib.Path.cwd()
          api = 'https://api.github.com/repos/tileflow/tileflow-sdk/'
          def blob(sha):
              request = urllib.request.Request(api + 'git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  value = json.load(response)
              return base64.b64decode(value['content']).decode('utf-8')
          inputs = [
              '01fd8677a60e15038d29232aaf16f321a1f93b4c',
              '24617a6e43d8a1ad83cf4e38b70a9cd244e93a48',
              '901713f99294981c5cd346f1ccab47115b29dcaf',
              '638850081f9d3c5e9288181bdbd179fb255e4a2b',
              '6f0b9b2e4c3e4ad8dfc84745c958a03f85385007',
              '113309c4e11f4fa892aa4dd253b63e7080772802',
              '6b13526e34101b9f0346d9798735bc0951b788d2',
              '6dd9cfb448fbab6e1509f92df03201c9be78c6bd',
              '22b5f2b9f76982e0a6a3e4abe4b3c1a8c1aff5e8',
          ]
          entries = [entry for sha in inputs for entry in json.loads(blob(sha))]
          paths = []
          for entry in entries:
              path = entry['path']
              assert re.fullmatch(r'(AGENTS\.md|CONTRIBUTING\.md|README\.md|llms\.txt|package\.json|docs/documentation\.md|packages/[a-z-]+/(README\.md|package\.json|docs/[a-z-]+\.md))', path), path
              assert path not in paths, path
              source = []
              if entry['sourceRef']:
                  assert entry['sourceRef'] in ['d80cdf2a4d5488a00351b391edeb0fffcca7181e', '72b46424ee3076585039293c8360dfd0ce347586']
                  source = subprocess.check_output(['git', 'show', entry['sourceRef'] + ':' + entry['sourcePath']]).decode().splitlines(keepends=True)
              parts = []
              for piece in entry['pieces']:
                  if isinstance(piece, str):
                      parts.append(piece)
                  else:
                      start, end = piece
                      assert 0 <= start <= end <= len(source), path
                      parts.append(''.join(source[start:end]))
              content = ''.join(parts)
              assert hashlib.sha256(content.encode()).hexdigest() == entry['sha256'], path
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)
              paths.append(path)
          for path, sha in {
              'scripts/check-docs.mjs': '55eb30191a68360998b178632d1f9f6f968e7412',
              'scripts/check-docs.test.mjs': '8cb8a5ef2713aa2a15fe7f71978f3e104725daf1',
          }.items():
              (root / path).write_text(blob(sha))
              paths.append(path)
          assert len(paths) == 56
          for path in paths:
              if not path.endswith('package.json'):
                  continue
              before = json.loads(subprocess.check_output(['git', 'show', 'HEAD:' + path]))
              after = json.loads((root / path).read_text())
              allowed = {'scripts'} if path == 'package.json' else {'files'}
              assert {k: v for k, v in before.items() if k not in allowed} == {k: v for k, v in after.items() if k not in allowed}, path
          replacements = {
              'packages/core/test/package.test.ts': (
                  "assert.deepEqual(manifest.files, ['dist', 'LICENSE', 'THIRD_PARTY_NOTICES.md']);",
                  "assert.deepEqual(manifest.files, ['dist', 'docs', 'LICENSE', 'THIRD_PARTY_NOTICES.md']);",
              ),
              'packages/maps/test/package.test.ts': (
                  "assert.deepEqual(manifest.files, ['assets', 'dist', 'THIRD_PARTY_NOTICES.md', 'LICENSE']);",
                  "assert.deepEqual(manifest.files, ['assets', 'docs', 'dist', 'THIRD_PARTY_NOTICES.md', 'LICENSE']);",
              ),
          }
          for path, (old, new) in replacements.items():
              target = root / path
              content = target.read_text()
              assert content.count(old) == 1, path
              target.write_text(content.replace(old, new))
              paths.append(path)
          directive = '> Related packages and guides: [documentation index](https://raw.githubusercontent.com/tileflow/tileflow-sdk/main/llms.txt).\n\n'
          for path in paths:
              if path == 'README.md' or re.fullmatch(r'packages/[a-z-]+/README\.md', path):
                  target = root / path
                  content = target.read_text()
                  position = content.index('\n## ') + 1
                  target.write_text(content[:position] + directive + content[position:])
          guide = root / 'docs/documentation.md'
          content = guide.read_text()
          old = 'package catalog and points directly to raw Markdown. Keep it synchronized when adding a package.'
          assert content.count(old) == 1
          guide.write_text(content.replace(old, old + '\nLink to that index near the top of every package README so readers arriving from npm can find it.'))
          assert len(paths) == 58
          (root / '.github/workflows/docs-review-stage.yml').unlink()
          pathlib.Path('/tmp/docs-review/paths.json').write_text(json.dumps(paths))
          pathlib.Path('/tmp/docs-review/paths.txt').write_text('\n'.join(paths) + '\n')
          print('Reconstructed 58 documentation and test files; temporary workflow excluded.')
          PY
      - name: Install review tooling
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm install --frozen-lockfile
      - name: Format the candidate
        id: format
        run: |
          python <<'PY'
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('/tmp/docs-review/paths.json').read_text())
          subprocess.run(['pnpm', 'exec', 'prettier', '--plugin=prettier-plugin-svelte', '--write', '--ignore-unknown', *paths], check=True)
          PY
      - name: Build
        id: build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/docs-review/build.log
      - name: Validate documentation and SDK
        id: checks
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee /tmp/docs-review/check.log
      - name: Store candidate Git objects without updating a branch
        if: always() && steps.apply.outcome == 'success' && steps.format.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          python <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          api = 'https://api.github.com/repos/tileflow/tileflow-sdk/'
          paths = json.loads(pathlib.Path('/tmp/docs-review/paths.json').read_text())
          workflow = '.github/workflows/docs-review-stage.yml'
          def request(path, data=None):
              assert path.startswith(('git/blobs', 'git/trees', 'git/ref/heads/'))
              payload = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(api + path, data=payload, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          assert request('git/ref/heads/docs/npm-package-guides')['object']['sha'] == parent, 'Review branch moved'
          subprocess.run(['git', 'add', '--', *paths, workflow], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines()
          assert set(changed) <= set(paths + [workflow])
          elements = []
          for path in changed:
              if path == workflow:
                  elements.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
              else:
                  content = pathlib.Path(path).read_text()
                  sha = request('git/blobs', {'content': content, 'encoding': 'utf-8'})['sha']
                  elements.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip()
          tree = request('git/trees', {'base_tree': base, 'tree': elements})['sha']
          result = {'parent': parent, 'tree': tree, 'build': os.environ['BUILD_OUTCOME'], 'checks': os.environ['CHECK_OUTCOME'], 'files': elements}
          pathlib.Path('/tmp/docs-review/candidate.json').write_text(json.dumps(result, indent=2))
          pathlib.Path('/tmp/docs-review/candidate.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          subprocess.run(['tar', '-cf', '/tmp/docs-review/candidate-files.tar', '-T', '/tmp/docs-review/paths.txt'], check=True)
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: docs-review-candidate
          path: /tmp/docs-review
          retention-days: 1
