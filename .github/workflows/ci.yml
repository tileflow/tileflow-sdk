name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify development release manifests
        run: pnpm run release:verify-source

      - name: Build
        run: pnpm build

      - name: Static checks
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm run check:static

      - name: Verify remaining packages
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm -r --workspace-concurrency=1 --filter '!tileflow' --filter '!@tileflow/dev' --if-present run verify

  verify-heavy:
    name: Package verification (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [tileflow, '@tileflow/dev']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: pnpm build

      - name: Verify package
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          TILEFLOW_TEST_CLI_MODE: ${{ matrix.package == 'tileflow' && 'built' || 'source' }}
        run: pnpm --filter '${{ matrix.package }}' run verify

  peer-compatibility:
    name: Peer compatibility (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [react, vue, svelte, vite, next, webpack]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compile packed consumers at declared peer boundaries
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm run smoke:peer-compat --suite ${{ matrix.suite }}

  capture-smoke:
    name: Capture smoke (${{ matrix.os }}, Node ${{ matrix.node }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
        suite: [capture, cli]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: pnpm build

      - name: Cache exact Chromium headless shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.62.1-chromium-headless-shell-1234

      - name: Install Linux Chromium dependencies
        if: runner.os == 'Linux'
        run: |
          sudo "$(command -v node)" scripts/remove-runner-chrome-repositories.mjs
          pnpm --filter @tileflow/capture exec playwright install-deps chromium

      - name: Provision pinned Chromium headless shell
        run: pnpm --filter @tileflow/capture exec playwright install --only-shell chromium

      - name: Authorize the pinned Chromium sandbox
        if: runner.os == 'Linux'
        run: bash scripts/configure-linux-chromium-sandbox.sh

      - name: Run cross-platform capture browser suite
        if: matrix.suite == 'capture'
        run: pnpm --filter @tileflow/capture run smoke:browser
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          TILEFLOW_RUN_BROWSER_TESTS: '1'
          TILEFLOW_TEST_PROGRESS: '1'
          NODE_OPTIONS: ${{ format('--test-reporter=tap --require={0}/test-support/test-progress.cjs', github.workspace) }}

      - name: Run cross-platform CLI browser suite
        if: matrix.suite == 'cli'
        run: pnpm --filter tileflow run test
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          TILEFLOW_RUN_BROWSER_TESTS: '1'
          TILEFLOW_TEST_PROGRESS: '1'
          TILEFLOW_TEST_CLI_MODE: built
          NODE_OPTIONS: ${{ format('--test-reporter=tap --require={0}/test-support/test-progress.cjs', github.workspace) }}

  capture-public-tarball:
    name: Clean packed capture consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: pnpm build

      - name: Cache exact Chromium headless shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.62.1-chromium-headless-shell-1234

      - name: Install Linux Chromium dependencies
        run: |
          sudo "$(command -v node)" scripts/remove-runner-chrome-repositories.mjs
          pnpm --filter @tileflow/capture exec playwright install-deps chromium

      - name: Provision pinned Chromium headless shell
        run: pnpm --filter @tileflow/capture exec playwright install --only-shell chromium

      - name: Authorize the pinned Chromium sandbox
        run: bash scripts/configure-linux-chromium-sandbox.sh

      - name: Audit and smoke packed packages
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm run smoke:capture-public

  swift:
    name: Swift SDK integration
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prepare embedded runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm install --frozen-lockfile
          pnpm native:runtime
      - name: Test in iOS Simulator
        run: |
          set -euo pipefail
          node scripts/mobile-fixture-server.mjs > "$RUNNER_TEMP/map-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          simulator_sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          device_id=$(node -e 'const fs=require("node:fs");const v=JSON.parse(fs.readFileSync(process.argv[1]));const runtime="com.apple.CoreSimulator.SimRuntime.iOS-"+process.argv[2].replaceAll(".","-");const d=v.devices[runtime]?.find(d=>d.isAvailable && d.name.startsWith("iPhone"));if(!d)throw Error("No iPhone simulator for "+runtime);process.stdout.write(d.udid)' "$RUNNER_TEMP/simulators.json" "$simulator_sdk")
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          curl --fail http://127.0.0.1:18645/manifest.json > /dev/null
          # WebKit needs an application host, not SwiftPM's standalone xctest process.
          xcodebuild test -project platforms/ios/IntegrationTests/TileflowIntegration.xcodeproj -scheme TileflowIntegration -destination "platform=iOS Simulator,id=$device_id" -resultBundlePath "$RUNNER_TEMP/Tileflow.xcresult" | tee "$RUNNER_TEMP/swift-tests.log"
          ! grep -E "Test Case .* skipped" "$RUNNER_TEMP/swift-tests.log"

  kotlin:
    name: Kotlin SDK package and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prepare embedded runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm install --frozen-lockfile
          pnpm native:runtime
      - name: Verify library and example
        working-directory: platforms/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew :tileflow:testDebugUnitTest :tileflow:lintRelease :tileflow:publishReleasePublicationToCandidateRepository :example:assembleDebug --console=plain

  required:
    name: Required
    if: always()
    needs:
      - verify
      - verify-heavy
      - peer-compatibility
      - capture-smoke
      - capture-public-tarball
      - swift
      - kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI gate
        env:
          CAPTURE_PUBLIC_TARBALL_RESULT: ${{ needs.capture-public-tarball.result }}
          CAPTURE_SMOKE_RESULT: ${{ needs.capture-smoke.result }}
          PEER_COMPATIBILITY_RESULT: ${{ needs.peer-compatibility.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          VERIFY_HEAVY_RESULT: ${{ needs.verify-heavy.result }}
          SWIFT_RESULT: ${{ needs.swift.result }}
          KOTLIN_RESULT: ${{ needs.kotlin.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$VERIFY_HEAVY_RESULT" = "success"
          test "$PEER_COMPATIBILITY_RESULT" = "success"
          test "$CAPTURE_SMOKE_RESULT" = "success"
          test "$CAPTURE_PUBLIC_TARBALL_RESULT" = "success"
          test "$SWIFT_RESULT" = "success"
          test "$KOTLIN_RESULT" = "success"
