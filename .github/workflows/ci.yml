name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify development release manifests
        run: pnpm run release:verify-source

      - name: Build
        run: pnpm build

      - name: Static checks
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm run check:static

      - name: Verify remaining packages
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm -r --workspace-concurrency=1 --filter '!tileflow' --filter '!@tileflow/dev' --if-present run verify

  verify-heavy:
    name: Package verification (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [tileflow, '@tileflow/dev']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: pnpm build

      - name: Verify package
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          TILEFLOW_TEST_CLI_MODE: ${{ matrix.package == 'tileflow' && 'built' || 'source' }}
        run: pnpm --filter '${{ matrix.package }}' run verify

  peer-compatibility:
    name: Peer compatibility (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [react, vue, svelte, vite, next, webpack]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compile packed consumers at declared peer boundaries
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm run smoke:peer-compat --suite ${{ matrix.suite }}

  capture-smoke:
    name: Capture smoke (${{ matrix.os }}, Node ${{ matrix.node }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
        suite: [capture, cli]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: pnpm build

      - name: Cache exact Chromium headless shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.62.1-chromium-headless-shell-1234

      - name: Install Linux Chromium dependencies
        if: runner.os == 'Linux'
        run: |
          sudo "$(command -v node)" scripts/remove-runner-chrome-repositories.mjs
          pnpm --filter @tileflow/capture exec playwright install-deps chromium

      - name: Provision pinned Chromium headless shell
        run: pnpm --filter @tileflow/capture exec playwright install --only-shell chromium

      - name: Authorize the pinned Chromium sandbox
        if: runner.os == 'Linux'
        run: bash scripts/configure-linux-chromium-sandbox.sh

      - name: Run cross-platform capture browser suite
        if: matrix.suite == 'capture'
        run: pnpm --filter @tileflow/capture run smoke:browser
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          TILEFLOW_RUN_BROWSER_TESTS: '1'
          TILEFLOW_TEST_PROGRESS: '1'
          NODE_OPTIONS: ${{ format('--test-reporter=tap --require={0}/test-support/test-progress.cjs', github.workspace) }}

      - name: Run cross-platform CLI browser suite
        if: matrix.suite == 'cli'
        # Map preparation and browser launches contend on every hosted runner.
        # Keep the existing startup deadlines and run every cross-platform test.
        run: pnpm --filter tileflow exec tsx --test --test-concurrency=2 'test/*.test.ts'
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          TILEFLOW_RUN_BROWSER_TESTS: '1'
          TILEFLOW_TEST_PROGRESS: '1'
          TILEFLOW_TEST_CLI_MODE: built
          NODE_OPTIONS: ${{ format('--test-reporter=tap --require={0}/test-support/test-progress.cjs', github.workspace) }}

  capture-public-tarball:
    name: Clean packed capture consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: pnpm build

      - name: Cache exact Chromium headless shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.62.1-chromium-headless-shell-1234

      - name: Install Linux Chromium dependencies
        run: |
          sudo "$(command -v node)" scripts/remove-runner-chrome-repositories.mjs
          pnpm --filter @tileflow/capture exec playwright install-deps chromium

      - name: Provision pinned Chromium headless shell
        run: pnpm --filter @tileflow/capture exec playwright install --only-shell chromium

      - name: Authorize the pinned Chromium sandbox
        run: bash scripts/configure-linux-chromium-sandbox.sh

      - name: Audit and smoke packed packages
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm run smoke:capture-public

  mobile-areas:
    name: Mobile change areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.areas.outputs.ios }}
      android: ${{ steps.areas.outputs.android }}
      react-native: ${{ steps.areas.outputs.reactNative }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test mobile job selection
        run: node --test scripts/mobile-ci-areas.test.mjs

      - name: Select mobile jobs
        id: areas
        env:
          MOBILE_CI_BASE: ${{ github.event.merge_group.base_sha }}
        run: node scripts/mobile-ci-areas.mjs >> "$GITHUB_OUTPUT"

  swift:
    name: Swift SDK on iOS Simulator
    needs: mobile-areas
    if: needs.mobile-areas.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify native API and fixtures
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm install --frozen-lockfile
          pnpm native:check-generated
          # The fixture server builds its self-hosted native map with these packages.
          pnpm exec turbo build --filter=@tileflow/dev --filter=@tileflow/maps
      - name: Start fixture map server and pinned iPhone simulator
        run: |
          # Hosted macOS images enable Reduce Motion. These tests exercise animations,
          # cancellation and intermediate frames, so run them with motion enabled.
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.Accessibility ReduceMotionEnabled -bool false
          swift -e 'import AppKit; precondition(!NSWorkspace.shared.accessibilityDisplayShouldReduceMotion, "Rendering tests require motion enabled")'
          nohup node scripts/mobile-fixture-server.mjs > "$RUNNER_TEMP/map-fixture.log" 2>&1 &
          udid=$(xcrun simctl create "Tileflow CI" "$SIMULATOR_DEVICE_TYPE" "$SIMULATOR_RUNTIME")
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          curl --retry 30 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:18645/manifest.json > /dev/null
      - name: Test on iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild test -project platforms/ios/IntegrationTests/TileflowIntegration.xcodeproj -scheme TileflowIntegration -destination "platform=iOS Simulator,id=$SIMULATOR_UDID,arch=arm64" -resultBundlePath "$RUNNER_TEMP/TileflowSimulator.xcresult" | tee "$RUNNER_TEMP/swift-simulator-tests.log"
          ! grep -E "Test Case .* skipped" "$RUNNER_TEMP/swift-simulator-tests.log"
      - name: Test the service clients on iOS Simulator
        working-directory: platforms/ios
        run: |
          set -euo pipefail
          # Contract tests against the shared recorded answers; they make no network requests.
          xcodebuild test -scheme Tileflow-Package -only-testing:TileflowServiceTests -destination "platform=iOS Simulator,id=$SIMULATOR_UDID,arch=arm64" | tee "$RUNNER_TEMP/swift-service-tests.log"
          ! grep -E "Test Case .* skipped" "$RUNNER_TEMP/swift-service-tests.log"
      - name: Upload Swift test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-integration-results
          path: |
            ${{ runner.temp }}/TileflowSimulator.xcresult
            ${{ runner.temp }}/swift-*-tests.log
            ${{ runner.temp }}/map-fixture.log
          retention-days: 7

  kotlin:
    name: Kotlin SDK package and contracts
    needs: mobile-areas
    if: needs.mobile-areas.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify native API and fixtures
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm install --frozen-lockfile
          pnpm native:check-generated
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('platforms/android/**/*.gradle.kts', 'platforms/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify library and example
        working-directory: platforms/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          modules="tileflow tileflow-services tileflow-foundation"
          tasks=()
          for module in $modules; do
            tasks+=(":$module:testDebugUnitTest" ":$module:lintRelease" ":$module:publishReleasePublicationToCandidateRepository")
          done
          ./gradlew "${tasks[@]}" :example:assembleDebug --console=plain

  android-emulator:
    name: Kotlin SDK on Android emulator (${{ matrix.name }})
    needs: mobile-areas
    if: needs.mobile-areas.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android 8
            api: 26
          - name: Android 15
            api: 35
          - name: Android 16
            api: 36
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify native API and fixtures
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm install --frozen-lockfile
          pnpm native:check-generated
          # The fixture server builds its self-hosted native map with these packages.
          pnpm exec turbo build --filter=@tileflow/dev --filter=@tileflow/maps
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('platforms/android/**/*.gradle.kts', 'platforms/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build instrumented test APKs
        working-directory: platforms/android
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then export JAVA_HOME="$JAVA_HOME_17_X64"; fi
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          ./gradlew :tileflow:assembleDebugAndroidTest --console=plain
      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start fixture map server
        run: |
          nohup node scripts/mobile-fixture-server.mjs > "$RUNNER_TEMP/map-fixture.log" 2>&1 &
          curl --retry 30 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:18645/manifest.json > /dev/null
      - name: Run instrumented tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          # Camera, annotation and shot tests require motion.
          disable-animations: false
          # Keep the Pixel 6 logical viewport while bounding software-GPU pixel work on hosted runners.
          # Keep the 200-view workload and functional assertions. Report latency on shared
          # software graphics; the strict hardware benchmark is run locally.
          script: |
            adb shell wm size 360x800
            adb shell wm density 140
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 1
            bash scripts/mobile-android-connected.sh -Pandroid.testInstrumentationRunnerArguments.tileflowAnnotationPerformance=report
      - name: Upload Android test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-results-${{ matrix.api }}
          path: |
            platforms/android/tileflow/build/reports/androidTests
            platforms/android/tileflow/build/outputs/androidTest-results
            ${{ runner.temp }}/android-connected
            ${{ runner.temp }}/map-fixture.log
          retention-days: 7

  react-native-native:
    name: React Native native unit tests
    needs: mobile-areas
    if: needs.mobile-areas.outputs.react-native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-react-native-${{ runner.os }}-${{ hashFiles('test-support/react-native-android/*.kts', 'platforms/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Test Android native modules on the JVM
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          platforms/android/gradlew -p test-support/react-native-android testDebugUnitTest --console=plain

  required:
    name: Required
    if: always()
    needs:
      - verify
      - verify-heavy
      - peer-compatibility
      - capture-smoke
      - capture-public-tarball
      - mobile-areas
      - swift
      - kotlin
      - android-emulator
      - react-native-native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI gate
        env:
          CAPTURE_PUBLIC_TARBALL_RESULT: ${{ needs.capture-public-tarball.result }}
          CAPTURE_SMOKE_RESULT: ${{ needs.capture-smoke.result }}
          PEER_COMPATIBILITY_RESULT: ${{ needs.peer-compatibility.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          VERIFY_HEAVY_RESULT: ${{ needs.verify-heavy.result }}
          MOBILE_AREAS_RESULT: ${{ needs.mobile-areas.result }}
          SWIFT_RESULT: ${{ needs.swift.result }}
          SWIFT_SELECTED: ${{ needs.mobile-areas.outputs.ios }}
          KOTLIN_RESULT: ${{ needs.kotlin.result }}
          ANDROID_EMULATOR_RESULT: ${{ needs.android-emulator.result }}
          ANDROID_SELECTED: ${{ needs.mobile-areas.outputs.android }}
          REACT_NATIVE_NATIVE_RESULT: ${{ needs.react-native-native.result }}
          REACT_NATIVE_SELECTED: ${{ needs.mobile-areas.outputs.react-native }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$VERIFY_HEAVY_RESULT" = "success"
          test "$PEER_COMPATIBILITY_RESULT" = "success"
          test "$CAPTURE_SMOKE_RESULT" = "success"
          test "$CAPTURE_PUBLIC_TARBALL_RESULT" = "success"
          test "$MOBILE_AREAS_RESULT" = "success"
          # A mobile job may be skipped only because its change area was not selected.
          selected() { test "$1" = "success" || { test "$1" = "skipped" && test "$2" = "false"; }; }
          selected "$SWIFT_RESULT" "$SWIFT_SELECTED"
          selected "$KOTLIN_RESULT" "$ANDROID_SELECTED"
          selected "$ANDROID_EMULATOR_RESULT" "$ANDROID_SELECTED"
          selected "$REACT_NATIVE_NATIVE_RESULT" "$REACT_NATIVE_SELECTED"
