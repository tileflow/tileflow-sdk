name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_pr_base_sha:
        description: Base SHA supplied by the trusted Release PR workflow.
        required: false
        type: string
      release_pr_head_sha:
        description: Head SHA supplied by the trusted Release PR workflow.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      # A merge group contains no single PR. Every member already passed this PR-specific gate;
      # the remaining jobs still rebuild and test the combined merge-group commit.
      - name: Verify pull request release intent
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_INTENT_MODE: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'changeset-release/main' && 'release-plan' || 'changesets' }}
        run: node scripts/release-packages-intent.mjs "$RELEASE_INTENT_MODE" "$BASE_SHA" "$HEAD_SHA"

      - name: Verify dispatched release pull request intent
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BASE_SHA: ${{ inputs.release_pr_base_sha }}
          HEAD_SHA: ${{ inputs.release_pr_head_sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/changeset-release/main"
          node scripts/release-packages-intent.mjs release-plan "$BASE_SHA" "$HEAD_SHA" --require-head
          node scripts/validate-release.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --require-packages

      - name: Build
        run: pnpm build

      - name: Typecheck, lint, and test
        run: pnpm check

  capture-smoke:
    name: Capture smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: pnpm build

      - name: Cache exact Chromium headless shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.60.0-chromium-headless-shell-1223

      - name: Install Linux Chromium dependencies
        if: runner.os == 'Linux'
        run: pnpm --filter @tileflow/capture exec playwright install-deps chromium

      - name: Provision pinned Chromium headless shell
        run: pnpm --filter @tileflow/capture exec playwright install --only-shell chromium

      - name: Authorize the pinned Chromium sandbox
        if: runner.os == 'Linux'
        run: bash scripts/configure-linux-chromium-sandbox.sh

      - name: Run cross-platform capture and browser suite
        run: pnpm --filter @tileflow/capture run smoke:browser
        env:
          TILEFLOW_RUN_BROWSER_TESTS: '1'

  capture-public-tarball:
    name: Clean packed capture consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: pnpm build

      - name: Cache exact Chromium headless shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.60.0-chromium-headless-shell-1223

      - name: Install Linux Chromium dependencies
        run: pnpm --filter @tileflow/capture exec playwright install-deps chromium

      - name: Provision pinned Chromium headless shell
        run: pnpm --filter @tileflow/capture exec playwright install --only-shell chromium

      - name: Authorize the pinned Chromium sandbox
        run: bash scripts/configure-linux-chromium-sandbox.sh

      - name: Audit and smoke packed packages
        run: pnpm run smoke:capture-public

  required:
    name: Required
    if: always()
    needs:
      - verify
      - capture-smoke
      - capture-public-tarball
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI gate
        env:
          CAPTURE_PUBLIC_TARBALL_RESULT: ${{ needs.capture-public-tarball.result }}
          CAPTURE_SMOKE_RESULT: ${{ needs.capture-smoke.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$CAPTURE_SMOKE_RESULT" = "success"
          test "$CAPTURE_PUBLIC_TARBALL_RESULT" = "success"
