name: Icon sets test workspace

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/icon-sets-workspace.yml

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/team-icon-sets-foundations'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm install --frozen-lockfile
      - name: Archive the public source and test dependencies
        run: |
          git rev-parse HEAD > WORKSPACE_SOURCE_SHA
          tar --exclude='./.git' --exclude='./node_modules/.cache' --exclude='.env' --exclude='.env.*' -czf "$RUNNER_TEMP/icon-sets-workspace.tgz" .
      - name: Store the temporary test workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icon-sets-workspace-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/icon-sets-workspace.tgz
          retention-days: 1
          compression-level: 0
