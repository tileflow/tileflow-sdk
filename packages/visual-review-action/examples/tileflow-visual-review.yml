# Renders pull request code. It holds no secrets and a read-only token, including on forks.
name: Tileflow visual review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tileflow-visual-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tileflow/tileflow-sdk/packages/visual-review-action@COMMIT_SHA
        with:
          mode: capture
