name: Native engine rendering

# Checks whether MapLibre Native draws on the hosted iOS Simulator: one run per change to this file.
on:
  push:
    branches:
      - na/native-engine-spikes-ios
    paths:
      - .github/workflows/native-engine-rendering.yml

permissions:
  contents: read

jobs:
  rendering:
    name: MapLibre Native on the hosted iOS Simulator
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start a pinned iPhone simulator
        run: |
          udid=$(xcrun simctl create "Native engine" "$SIMULATOR_DEVICE_TYPE" "$SIMULATOR_RUNTIME")
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          sysctl -n machdep.cpu.brand_string hw.model
          system_profiler SPDisplaysDataType | sed -n '1,20p'
      - name: Draw maps and check their pixels
        run: |
          set -euo pipefail
          # The tests that draw need no embedded runtime; the package only requires its folder.
          mkdir -p platforms/ios/Sources/Tileflow/EmbeddedRuntime "$RUNNER_TEMP/evidence"
          TEST_RUNNER_NATIVE_ENGINE_EVIDENCE_DIR="$RUNNER_TEMP/evidence" xcodebuild test \
            -project platforms/ios/NativeEngineSpikes/NativeEngineSpikes.xcodeproj \
            -scheme NativeEngineSpikes \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID,arch=arm64" \
            -only-testing:NativeEngineTests/RenderingTests/testTheEngineDrawsAStyleOnScreen \
            -only-testing:NativeEngineTests/PitchTests/testPitch85 \
            -resultBundlePath "$RUNNER_TEMP/NativeEngine.xcresult" \
            | tee "$RUNNER_TEMP/native-engine-tests.log"
      - name: Collect crash reports
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence/crashes"
          find ~/Library/Logs/DiagnosticReports -mmin -30 -type f -exec cp {} "$RUNNER_TEMP/evidence/crashes/" \; || true
          ls -la "$RUNNER_TEMP/evidence/crashes"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-engine-rendering
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/NativeEngine.xcresult
            ${{ runner.temp }}/native-engine-tests.log
          retention-days: 7
