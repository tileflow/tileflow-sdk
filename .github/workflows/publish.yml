name: Publish
run-name: Publish ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  eligibility:
    name: Release eligibility
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.release.outputs.base_sha }}
      eligible: ${{ steps.release.outputs.eligible }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}

      - name: Resolve associated pull request
        id: pull-request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {
              assertTrustedMainCiRun,
              classifyAssociatedPullRequests,
            } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-workflow.mjs`);
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const releaseSha = assertTrustedMainCiRun(context.payload.workflow_run, repository);
            if (releaseSha !== process.env.RELEASE_SHA) {
              throw new Error(`Workflow release SHA mismatch: ${releaseSha} != ${process.env.RELEASE_SHA}.`);
            }

            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: releaseSha,
                per_page: 100,
              },
            );
            const release = classifyAssociatedPullRequests(pullRequests, repository, releaseSha);
            core.setOutput('base_sha', release.baseSha ?? '');
            core.setOutput('pull_number', release.pullNumber?.toString() ?? '');
            core.setOutput('trusted_release', release.trustedRelease ? 'true' : 'false');

      - name: Classify release plan change
        id: release
        shell: bash
        env:
          ASSOCIATED_BASE_SHA: ${{ steps.pull-request.outputs.base_sha }}
          PULL_NUMBER: ${{ steps.pull-request.outputs.pull_number }}
          TRUSTED_RELEASE: ${{ steps.pull-request.outputs.trusted_release }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          first_parent="$(git rev-parse "$RELEASE_SHA^1")"
          base_sha="${ASSOCIATED_BASE_SHA:-$first_parent}"
          git merge-base --is-ancestor "$base_sha" "$RELEASE_SHA"

          if git diff --quiet "$base_sha" "$RELEASE_SHA" -- .changeset/release-plan.json
          then
            plan_changed=false
          else
            plan_changed=true
          fi

          if [[ "$TRUSTED_RELEASE" = true && "$plan_changed" != true ]]
          then
            echo "Official Release PR #$PULL_NUMBER did not change the release plan."
            exit 1
          fi
          if [[ "$TRUSTED_RELEASE" != true && "$plan_changed" = true ]]
          then
            echo "Only changeset-release/main may change the release plan on main."
            exit 1
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "eligible=$TRUSTED_RELEASE" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish selected packages
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    concurrency:
      group: npm-publish
      queue: max
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      BASE_SHA: ${{ needs.eligibility.outputs.base_sha }}
      NPM_TAG: alpha
      NPM_CONFIG_PROVENANCE: 'true'
      RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate automatic release and package versions
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          node scripts/release-packages-intent.mjs \
            release-plan "$BASE_SHA" "$RELEASE_SHA" --require-head
          node scripts/validate-release.mjs \
            --base "$BASE_SHA" \
            --head "$RELEASE_SHA" \
            --require-packages

      - name: Build packages
        run: pnpm build

      - name: Verify
        run: pnpm check

      - name: Pack packages
        shell: bash
        run: |
          set -euo pipefail

          pack_dir="$RUNNER_TEMP/tileflow-packs"
          mkdir -p "$pack_dir"
          : > "$pack_dir/tarballs.txt"

          for package_dir in \
            packages/core \
            packages/static \
            packages/dev \
            packages/capture \
            packages/vite \
            packages/next \
            packages/webpack \
            packages/react \
            packages/vue \
            packages/svelte \
            packages/cli
          do
            filename="$(
              cd "$package_dir"
              pnpm pack --pack-destination "$pack_dir" --json \
                | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const parsed = JSON.parse(data); const results = Array.isArray(parsed) ? parsed : [parsed]; if (results.length !== 1 || typeof results[0]?.filename !== 'string') throw new Error('Unexpected pnpm pack JSON.'); console.log(results[0].filename); });"
            )"

            if [[ "$filename" = /* ]]
            then
              echo "$filename" >> "$pack_dir/tarballs.txt"
            else
              echo "$pack_dir/$filename" >> "$pack_dir/tarballs.txt"
            fi
          done

          node scripts/select-release-tarballs.mjs \
            .changeset/release-plan.json \
            "$pack_dir/tarballs.txt" \
            "$pack_dir/selected-tarballs.txt" \
            "$pack_dir/registry-dependencies.txt"

      - name: Provision pinned capture browser dependencies
        run: pnpm --filter @tileflow/capture exec playwright install-deps chromium

      - name: Provision pinned capture browser shell
        run: pnpm --filter @tileflow/capture exec playwright install --only-shell chromium

      - name: Authorize the pinned Chromium sandbox
        run: bash scripts/configure-linux-chromium-sandbox.sh

      - name: Verify the pinned capture browser shell
        run: pnpm --filter @tileflow/cli run cli setup capture --json --no-browser-install

      - name: Smoke packed capture CLI
        run: node scripts/capture-public-smoke.mjs --pack-dir "$RUNNER_TEMP/tileflow-packs"

      - name: Preflight npm registry
        shell: bash
        run: |
          set -euo pipefail

          : > "$RUNNER_TEMP/tileflow-packs/publish.txt"
          : > "$RUNNER_TEMP/tileflow-packs/published.txt"
          published_dir="$RUNNER_TEMP/tileflow-packs/registry"
          mkdir -p "$published_dir"

          while IFS=$'\t' read -r dependency_name dependency_version
          do
            [[ -n "$dependency_name" ]] || continue
            if dependency_output="$(npm view "$dependency_name@$dependency_version" version --prefer-online 2>&1)"
            then
              if [[ "$dependency_output" != "$dependency_version" ]]
              then
                echo "$dependency_name@$dependency_version returned unexpected registry version $dependency_output."
                exit 1
              fi
              continue
            fi

            echo "$dependency_output"
            echo "Release packages require $dependency_name@$dependency_version, but that exact version is not available from npm."
            exit 1
          done < "$RUNNER_TEMP/tileflow-packs/registry-dependencies.txt"

          while IFS= read -r tarball
          do
            package_json="$(tar -xOf "$tarball" package/package.json)"
            package_name="$(PACKAGE_JSON="$package_json" node -e "const packageJson = JSON.parse(process.env.PACKAGE_JSON); console.log(packageJson.name);")"
            package_version="$(PACKAGE_JSON="$package_json" node -e "const packageJson = JSON.parse(process.env.PACKAGE_JSON); console.log(packageJson.version);")"
            previous_version="$(
              PACKAGE_NAME="$package_name" node -e "const plan = require('./.changeset/release-plan.json'); const release = plan.packages.find(({name}) => name === process.env.PACKAGE_NAME); if (!release) throw new Error('Selected package is missing from the release plan.'); console.log(release.from);"
            )"

            if current_tag="$(npm view "$package_name" "dist-tags.$NPM_TAG" --prefer-online 2>&1)"
            then
              if [[ -n "$current_tag" ]]
              then
                node scripts/assert-version-not-behind.mjs "$package_version" "$current_tag"
              fi
            elif [[ "$current_tag" != *E404* ]]
            then
              echo "$current_tag"
              echo "Unable to determine the current $NPM_TAG dist-tag for $package_name."
              exit 1
            fi

            if view_output="$(npm view "$package_name@$package_version" version --prefer-online 2>&1)"
            then
              if [[ "$view_output" != "$package_version" ]]
              then
                echo "$package_name@$package_version returned unexpected registry version $view_output."
                exit 1
              fi

              published_tarball="$(
                npx npm@11.19.0 pack "$package_name@$package_version" \
                  --pack-destination "$published_dir" \
                  --json \
                  | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const result = JSON.parse(data); if (!Array.isArray(result) || result.length !== 1 || typeof result[0]?.filename !== 'string') throw new Error('Unexpected npm pack JSON.'); console.log(result[0].filename); });"
              )"
              if [[ "$published_tarball" != /* ]]
              then
                published_tarball="$published_dir/$published_tarball"
              fi

              node scripts/compare-package-tarballs.mjs "$tarball" "$published_tarball"
              published_tag="$(npm view "$package_name" "dist-tags.$NPM_TAG" --prefer-online)"
              if [[ "$published_tag" != "$package_version" ]]
              then
                echo "$package_name@$package_version exists but the $NPM_TAG dist-tag points to $published_tag."
                exit 1
              fi

              echo "$tarball" >> "$RUNNER_TEMP/tileflow-packs/published.txt"
              continue
            fi

            if [[ "$view_output" != *E404* ]]
            then
              echo "$view_output"
              echo "Unable to determine registry state for $package_name@$package_version."
              exit 1
            fi

            if [[ "$current_tag" != "$previous_version" ]]
            then
              echo "$package_name must advance from $previous_version, but the $NPM_TAG dist-tag currently points to ${current_tag:-<missing>}."
              echo "A prior release may still be pending or this release may be stale; investigate before retrying."
              exit 1
            fi
            if previous_output="$(npm view "$package_name@$previous_version" version --prefer-online 2>&1)"
            then
              if [[ "$previous_output" != "$previous_version" ]]
              then
                echo "$package_name@$previous_version returned unexpected registry version $previous_output."
                exit 1
              fi
            else
              echo "$previous_output"
              echo "$package_name cannot advance to $package_version because $previous_version is not available from npm."
              exit 1
            fi

            echo "$tarball" >> "$RUNNER_TEMP/tileflow-packs/publish.txt"
          done < "$RUNNER_TEMP/tileflow-packs/selected-tarballs.txt"

          selected_count="$(wc -l < "$RUNNER_TEMP/tileflow-packs/selected-tarballs.txt" | tr -d ' ')"
          publish_count="$(wc -l < "$RUNNER_TEMP/tileflow-packs/publish.txt" | tr -d ' ')"
          published_count="$(wc -l < "$RUNNER_TEMP/tileflow-packs/published.txt" | tr -d ' ')"
          if [[ "$((publish_count + published_count))" != "$selected_count" ]]
          then
            echo "Expected $selected_count validated release packages, found $((publish_count + published_count))."
            exit 1
          fi

          echo "Registry preflight passed for $selected_count release packages: $publish_count new, $published_count identical."

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]
          then
            echo "GitHub did not expose the OIDC request credentials."
            exit 1
          fi

          while IFS= read -r tarball
          do
            npx npm@11.19.0 publish "$tarball" \
              --access public \
              --registry https://registry.npmjs.org \
              --tag "$NPM_TAG" \
              --provenance \
              --loglevel verbose
          done < "$RUNNER_TEMP/tileflow-packs/publish.txt"
